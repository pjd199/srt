name: SRT Reading Plans Automation

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Reading plan slug (e.g., luke-2, 1-2-peter)'
        required: true
        default: 'luke-2'
        type: string
      version:
        description: Bible Translation
        type: choice
        required: true
        default: 'esv'
        options:
        - niv
        - esv
        - nlt
        - msg
  schedule:
    # Runs daily at 04:00 UTC to keep cache warm
    - cron: '0 4 * * *'

jobs:
  build-plan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Restore Cache Directory
        uses: actions/cache@v6
        with:
          path: ./cache
          key: srt-cache-${- github.run_id -}
          restore-keys: |
            srt-cache-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Download and Build Plan (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          API_BIBLE_KEY: ${{ secrets.API_BIBLE_KEY }}
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          srt download ${{ inputs.slug }} ${{ inputs.version }}

      - name: Upload EPUB Artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.slug }}-${{ inputs.version }}
          path: ./plans/epub/${{ inputs.slug }}/${{ inputs.slug }}-${{ inputs.version }}.epub
          archive: false
          retention-days: 7