name: SRT Reading Plans Automation

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Reading plan slug (e.g., luke-2, 1-2-peter)'
        required: true
        default: 'luke-2'
        type: string
      version:
        description: Bible Translation
        type: choice
        required: true
        default: 'esv'
        options:
        - niv
        - esv
        - nlt
        - msg
  schedule:
    # Runs daily at 04:00 UTC to keep cache warm
    - cron: '0 4 * * *'

jobs:
  build-plan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Restore Cache Directory
        uses: actions/cache@v6
        with:
          path: ./cache
          key: srt-cache-${{ hashFiles( './src/srt/cache.py', '**/pyproject.toml' ) }}
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Download and Build Plan (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          API_BIBLE_KEY: ${{ secrets.API_BIBLE_KEY }}
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          srt download ${{ inputs.slug }} ${{ inputs.version }}

      - name: Rename SRT Artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          cp ./plans/shereadstruth.com/epub/${{ inputs.slug }}/${{ inputs.slug }}-${{ inputs.version }}.epub \
             srt-${{ inputs.slug }}-${{ inputs.version }}.epub

      - name: Upload SRT EPUB Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: srt-${{ inputs.slug }}-${{ inputs.version }}.epub
          archive: false
          retention-days: 7

      - name: Rename HRT Artifact
        if: github.event_name == 'workflow_dispatch'
        run: |
          cp ./plans/hereadstruth.com/epub/${{ inputs.slug }}/${{ inputs.slug }}-${{ inputs.version }}.epub \
             hrt-${{ inputs.slug }}-${{ inputs.version }}.epub

      - name: Upload HRT EPUB Artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          path: hrt-${{ inputs.slug }}-${{ inputs.version }}.epub
          archive: false
          retention-days: 7