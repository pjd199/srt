name: SRT Reading Plans Automation

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Reading plan slug (e.g., luke-2, 1-2-peter)'
        required: true
        default: 'luke-2'
        type: string

jobs:
  build-plan:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Restore Cache Directory
        uses: actions/cache@v4
        with:
          path: ./cache
          key: srt-cache-${- github.run_id -}
          restore-keys: |
            srt-cache-

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Download and Build Plan (Manual Dispatch)
        if: github.event_name == 'workflow_dispatch'
        env:
          API_BIBLE_KEY: ${{ secrets.API_BIBLE_KEY }}
          ESV_API_KEY: ${{ secrets.ESV_API_KEY }}
        run: |
          srt download ${{ inputs.slug }}

      - name: Upload EPUB Artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: srt-epub-${{ inputs.slug }}
          path: ./plans/epub/${{ inputs.slug }}/*.epub
          retention-days: 30