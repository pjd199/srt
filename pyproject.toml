[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "srt"
version = "0.1.0"
description = "Scrapes She Reads Truth reading plans and converts them to EPUB/HTML/Markdown for Kindle."
readme = "README.md"
authors = [{name = "pjd199"}]
license = "MIT"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
requires-python = ">=3.10"
dependencies = [
    "click>=8.1",
    "requests>=2.34",
    "beautifulsoup4>=4.15",
    "EbookLib>=0.21",
    "html2text>=2020.1.15",
]

[project.scripts]
srt = "srt.cli:main"
